      transform: translateY(-2px);
      border-color: rgba(0, 240, 255, 0.6);

      font-weight: 700;
      color: #fff;
    }
    .sound-desc {

    }

    }

            const now = step * sixteenth;

              bassGain.connect(ctx.destination);
              bassOsc.start(now);
              bassOsc.stop(now + 0.095);
            }

    // --- AudioBuffer to standard WAV file converter (16-bit PCM) ---
    function audioBufferToWav(buffer) {
      const numChannels = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const format = 1; // PCM
      const bitDepth = 16;
      
      const bytesPerSample = bitDepth / 8;
      const blockAlign = numChannels * bytesPerSample;
      
      const length = buffer.length * numChannels * bytesPerSample;
      const bufferArray = new ArrayBuffer(44 + length);
      const view = new DataView(bufferArray);
      
      // RIFF identifier
      writeString(view, 0, 'RIFF');
      // file length minus RIFF identifier & length
      view.setUint32(4, 36 + length, true);
      // RIFF type
      writeString(view, 8, 'WAVE');
      // format chunk identifier
      writeString(view, 12, 'fmt ');
      // format chunk length
      view.setUint32(16, 16, true);
      // sample format (raw)
      view.setUint16(20, format, true);
      // channel count
      view.setUint16(22, numChannels, true);
      // sample rate
      view.setUint32(24, sampleRate, true);
      // byte rate (sample rate * block align)
      view.setUint32(28, sampleRate * blockAlign, true);
      // block align (channel count * bytes per sample)
      view.setUint16(32, blockAlign, true);
      // bits per sample
      view.setUint16(34, bitDepth, true);
      // data chunk identifier
      writeString(view, 36, 'data');
      // data chunk length
      view.setUint32(40, length, true);
      
      // Write interleaved samples
      let offset = 44;
      const channels = [];
      for (let i = 0; i < numChannels; i++) {
        channels.push(buffer.getChannelData(i));
      }
      
      for (let i = 0; i < buffer.length; i++) {
        for (let ch = 0; ch < numChannels; ch++) {
          let sample = channels[ch][i];
          // Clamp
          sample = Math.max(-1, Math.min(1, sample));
          // Convert to 16-bit signed integer
          view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
          offset += 2;
        }
      }
      
      return new Blob([view], { type: 'audio/wav' });
    }

    function writeString(view, offset, string) {
      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }

    // --- Render Sound into WAV Blob ---
    async function renderSoundToWav(soundDef) {
      const length = Math.ceil(SAMPLE_RATE * soundDef.duration);
      const offlineCtx = new OfflineAudioContext(1, length, SAMPLE_RATE);
      soundDef.render(offlineCtx);
      const renderedBuffer = await offlineCtx.startRendering();
      return audioBufferToWav(renderedBuffer);
    }

    // --- Play Sound via Web Audio ---
    let liveAudioCtx = null;
    function playSound(soundDef) {
      if (!liveAudioCtx) {
        liveAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (liveAudioCtx.state === 'suspended') {
        liveAudioCtx.resume();
      }
      soundDef.render(liveAudioCtx);
    }

    // --- Download helper ---
    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

      card.className = 'sound-card';
      card.innerHTML = `
        <div class="sound-info">
          <div class="sound-name">${sound.name}</div>
          <div class="sound-desc">${sound.desc}</div>
        </div>
        <div class="sound-controls">
          <button class="icon-btn play-btn" title="Play Sound">▶ PLAY</button>
          <button class="icon-btn download-btn" title="Download WAV">⬇ WAV</button>
        </div>
      `;

      const playBtn = card.querySelector('.play-btn');
      playBtn.addEventListener('click', () => playSound(sound));

      const downloadBtn = card.querySelector('.download-btn');
      downloadBtn.addEventListener('click', async () => {
        downloadBtn.textContent = '⏳ ...';
        const wavBlob = await renderSoundToWav(sound);
        triggerDownload(wavBlob, sound.filename);
        downloadBtn.textContent = '⬇ WAV';
      });

      soundList.appendChild(card);
    });

    // --- Download All Handler ---
    const downloadAllBtn = document.getElementById('download-all-btn');
    downloadAllBtn.addEventListener('click', async () => {
      downloadAllBtn.textContent = '⏳ RENDERING ALL SOUNDS...';
      for (let i = 0; i < SOUNDS.length; i++) {
        const sound = SOUNDS[i];
        const wavBlob = await renderSoundToWav(sound);
        triggerDownload(wavBlob, sound.filename);
        // Small pause between file downloads so the browser doesn't block them
        await new Promise((r) => setTimeout(r, 220));
      }
      downloadAllBtn.textContent = '✅ ALL DOWNLOADS STARTED!';
      setTimeout(() => {
        downloadAllBtn.textContent = '📦 DOWNLOAD ALL SOUNDS (.WAV)';
      }, 3000);
    });
  </script>
</body>
</html>
