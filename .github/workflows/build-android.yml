name: Build Pure Native Android App Bundle (AAB & APK)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android Version Code'
        required: true
        default: '17'
      version_name:
        description: 'Android Version Name'
        required: true
        default: '1.0.17'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-and-sign:
    name: Build & Sign Pure Native Android Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Web Game Assets into Android Assets Folder
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html style.css game.js audio.js three.min.js manifest.json icon-192.png icon-512.png icon-512-maskable.png android/app/src/main/assets/

      - name: Sync 3D App Icons to All Android Mipmap Densities
        run: |
          for res in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-${res}
            cp icon-512.png android/app/src/main/res/mipmap-${res}/ic_launcher.png
            cp icon-512-maskable.png android/app/src/main/res/mipmap-${res}/ic_launcher_round.png
            cp icon-512-maskable.png android/app/src/main/res/mipmap-${res}/ic_launcher_foreground.png
          done

      - name: Build Signed Android App Bundle (AAB) & Debug APK
        working-directory: ./android
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > app/signing.keystore
          elif [ -f "../signing.keystore" ]; then
            cp ../signing.keystore app/signing.keystore
          fi
          ./gradlew bundleRelease assembleRelease assembleDebug --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab ../disc-run.aab
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk ../disc-run.apk
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk ../disc-run.apk
          fi

      - name: Upload Android App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: disc-run-bundle-v${{ github.event.inputs.version_name || '1.0.17' }}
          path: disc-run.aab

      - name: Upload Test APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: disc-run-apk-v${{ github.event.inputs.version_name || '1.0.17' }}
          path: disc-run.apk

      - name: Publish Direct Download GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.17"
          name: "Disc Run Pure Native Android Release (v1.0.17)"
          body: "Pure Native Android Studio Shell for Disc Run. 100% Offline, Hardware-Accelerated WebGL, Zero URL bar, Signed with release keystore."
          files: |
            disc-run.apk
            disc-run.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
