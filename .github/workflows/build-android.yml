name: Build Pure Native Android App Bundle (AAB & APK)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android Version Code'
        required: true
        default: '16'
      version_name:
        description: 'Android Version Name'
        required: true
        default: '1.0.16'
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Web Game Assets into Android Assets Folder
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html style.css game.js audio.js three.min.js manifest.json android/app/src/main/assets/
          cp -r icon-*.png android/app/src/main/assets/ 2>/dev/null || true
          cp signing.keystore android/app/signing.keystore 2>/dev/null || true

      - name: Sync 3D App Icons to All Android Mipmap Densities
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$density
            cp icon-512.png android/app/src/main/res/mipmap-$density/ic_launcher.png 2>/dev/null || true
            cp icon-512.png android/app/src/main/res/mipmap-$density/ic_launcher_round.png 2>/dev/null || true
          done

      - name: Build Signed Android App Bundle (AAB) & Debug APK
        working-directory: android
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/*.apk ../disc-run.apk
          cp app/build/outputs/bundle/release/*.aab ../disc-run.aab

      - name: Upload Android App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Disc-Run-Android-App-Bundle-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Upload Test APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Disc-Run-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish Direct Download GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.16"
          name: "Disc Run Pure Native Android Release (v1.0.16)"
          body: "Pure Native Android Studio Shell for Disc Run. 100% Offline, Hardware-Accelerated WebGL, Zero URL bar, Signed with release keystore."
          files: |
            disc-run.apk
            disc-run.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
