name: Build Pure Native Android App Bundle (AAB & APK)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android Version Code'
        required: true
        default: '22'
      version_name:
        description: 'Android Version Name'
        required: true
        default: '1.0.22'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-and-sign:
    name: Build & Sign Pure Native Android Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Sync Web Game Assets into Android Assets Folder
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html style.css game.js audio.js three.min.js manifest.json icon-192.png icon-512.png icon-512-maskable.png android/app/src/main/assets/

      - name: Sync 3D App Icons to All Android Mipmap Densities
        run: |
          for res in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-${res}
            cp icon-512.png android/app/src/main/res/mipmap-${res}/ic_launcher.png
            cp icon-512-maskable.png android/app/src/main/res/mipmap-${res}/ic_launcher_round.png
            cp icon-512-maskable.png android/app/src/main/res/mipmap-${res}/ic_launcher_foreground.png
          done

      - name: Build Signed Android App Bundle (AAB) & Debug APK
        working-directory: ./android
        run: |
          mkdir -p app
          cp ../signing.keystore app/signing.keystore 2>/dev/null || true
          gradle bundleRelease assembleDebug --stacktrace 2>&1 | tee ../gradle_build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== GRADLE BUILD FAILED ==="
            tail -n 80 ../gradle_build.log
            exit 1
          fi
          cp app/build/outputs/bundle/release/*.aab ../disc-run.aab
          cp app/build/outputs/apk/debug/*.apk ../disc-run.apk 2>/dev/null || true

      - name: Upload Build Log on Failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-build-log
          path: gradle_build.log

      - name: Upload Android App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: disc-run-bundle-v${{ github.event.inputs.version_name || '1.0.22' }}
          path: disc-run.aab

      - name: Upload Test APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: disc-run-apk-v${{ github.event.inputs.version_name || '1.0.22' }}
          path: disc-run.apk

      - name: Publish Failure Log if Build Fails
        uses: softprops/action-gh-release@v2
        if: failure() && github.ref == 'refs/heads/main'
        with:
          tag_name: "build-failure-log"
          name: "Build Failure Diagnostics Log"
          body: "Gradle build failure logs for inspection."
          files: gradle_build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Direct Download GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.22"
          name: "Disc Run Pure Native Android Release (v1.0.22)"
          body: "Pure Native Android Studio Shell for Disc Run with AD_ID permission, New Full-Bleed Neon Cyber App Icon & Live Google AdMob Ads. 100% Offline fallback, Hardware-Accelerated WebGL, Zero URL bar, Signed with release keystore."
          files: |
            disc-run.apk
            disc-run.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

