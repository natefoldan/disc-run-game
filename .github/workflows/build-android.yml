name: Build Native Android App Bundle (AAB & APK)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android Version Code'
        required: true
        default: '11'
      version_name:
        description: 'Android Version Name'
        required: true
        default: '1.0.11'
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Distribution Folder (www)
        run: |
          mkdir -p www
          cp index.html style.css game.js audio.js three.min.js manifest.json www/
          cp -r icon-*.png www/ 2>/dev/null || true

      - name: Install NPM Dependencies
        run: npm install

      - name: Initialize Capacitor Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Configure Package ID, Version, Fullscreen & Signing
        run: |
          node scripts/configure-android.js "${{ github.event.inputs.version_code || '11' }}" "${{ github.event.inputs.version_name || '1.0.11' }}"
          echo "=== Verified build.gradle Configuration ==="
          cat android/app/build.gradle | grep -E "versionCode|versionName|compileSdk|targetSdk|applicationId"

      - name: Build Signed Android App Bundle (AAB) & APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/*.apk ../disc-run.apk
          cp app/build/outputs/bundle/release/*.aab ../disc-run.aab

      - name: Upload Android App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Disc-Run-Android-App-Bundle-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Upload Test APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Disc-Run-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish Direct Download GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.11"
          name: "Disc Run Android Native Release (v1.0.11)"
          body: "Direct 1-tap download for Disc Run Native Android App (No URL bar, 100% offline, local Three.js bundle)."
          files: |
            disc-run.apk
            disc-run.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
